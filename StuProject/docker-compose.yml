name: frontend-issue-agent

services:
  postgres:
    image: postgres:16-alpine
    container_name: issue-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-agent}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agent_dev_pw}
      POSTGRES_DB: ${PG_DATABASE:-issue_agent}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    container_name: issue-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - agent-network

volumes:
  postgres-data:
    name: issue-agent-postgres-data
  redis-data:
    name: issue-agent-redis-data

networks:
  agent-network:
    name: issue-agent-network
    driver: bridge
